name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Readiness blockers v1 (review χρήστη) — υποχρεωτικό πριν από το build/deploy: μια
      # αποτυχία εδώ ΣΤΑΜΑΤΑΕΙ ολόκληρο το workflow, ΚΑΝΕΝΑ deploy δεν συμβαίνει.
      - run: npm test
      - run: npm run build
        env:
          # Sprint 5A Phase 1 — όχι μυστικό (βλ. .env.example), γι' αυτό repository VARIABLE
          # (vars.*) και όχι secret. Απουσία αυτής της μεταβλητής (π.χ. σε fork) σημαίνει το
          # feature flag είναι off — build χωρίς κανένα cloud addon ενεργό.
          VITE_DEXIE_CLOUD_URL: ${{ vars.VITE_DEXIE_CLOUD_URL }}
      # Readiness blockers v1 (review χρήστη) — pre-deploy smoke: Playwright σερβίρει το ΙΔΙΟ
      # build που μόλις παράχθηκε παραπάνω με `npm run preview` (πραγματικό production build,
      # ΟΧΙ dev server — βλ. playwright.config.js#webServer), ΟΧΙ PLAYWRIGHT_BASE_URL εδώ ρητά.
      # Μια αποτυχία εδώ αποτυγχάνει το build job ΚΑΙ μπλοκάρει το deploy job παρακάτω.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-post-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Readiness blockers v1 (review χρήστη) — δεύτερο, ανεξάρτητο πέρασμα ΠΑΝΩ στο πραγματικό,
      # ήδη δημοσιευμένο GitHub Pages URL: πραγματική επιβεβαίωση deploy/assets/PWA στο production,
      # ΟΧΙ απλώς τοπικό preview. ΔΕΝ μπλοκάρει το ήδη ολοκληρωμένο deploy (έχει ήδη συμβεί) — απλή
      # ειδοποίηση/ανίχνευση αν κάτι ειδικά για GitHub Pages (base path/CDN/service worker) έσπασε.
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
