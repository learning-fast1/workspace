<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#c9a876" />
    <title>Workspace Ειδικού Παιδαγωγού</title>
    <!-- Google tag (gtag.js) — μόνο σε production (όχι localhost/dev/e2e), χωρίς Google Signals και
         ad personalization. Τα routes (HashRouter) περιέχουν μόνο αδιαφανή IDs, ποτέ ονόματα μαθητών. -->
    <script>
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NKD27PPPE6'
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        function gtag(){dataLayer.push(arguments)}
        gtag('js', new Date())
        gtag('config', 'G-NKD27PPPE6', {
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
